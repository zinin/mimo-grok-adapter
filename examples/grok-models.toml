# Merge missing sections into ~/.grok/config.toml; preserve [models] defaults.
# MIMO_API_KEY: Singapore Token Plan key (existing variable remains compatible).
# MIMO_PAYG_API_KEY: ordinary pay-as-you-go API key.
# Keep each key with its matching route and avoid duplicate [model.*] sections.

[model."mimo-v2.6-flash-adapted"]
model = "mimo-v2.6-flash"
name = "MiMo-V2.6-Flash [Token Plan adapter]"
base_url = "http://127.0.0.1:8320/v1"
api_backend = "responses"
env_key = "MIMO_API_KEY"
context_window = 1048576
max_request_bytes = 33554432
reasoning_effort = "high"

[model."mimo-v2.6-pro-adapted"]
model = "mimo-v2.6-pro"
name = "MiMo-V2.6-Pro [Token Plan adapter]"
base_url = "http://127.0.0.1:8320/v1"
api_backend = "responses"
env_key = "MIMO_API_KEY"
context_window = 1048576
max_request_bytes = 33554432
reasoning_effort = "high"

[model."mimo-v2.6-flash-api-adapted"]
model = "mimo-v2.6-flash"
name = "MiMo-V2.6-Flash [pay-as-you-go API adapter]"
base_url = "http://127.0.0.1:8320/api/v1"
api_backend = "responses"
env_key = "MIMO_PAYG_API_KEY"
context_window = 1048576
max_request_bytes = 33554432
reasoning_effort = "high"

[model."mimo-v2.6-pro-api-adapted"]
